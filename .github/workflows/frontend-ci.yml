name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # ⚠️ pull_request 에는 paths 필터를 두지 않는다. 사유는 backend-ci.yml 참조.
  pull_request:
    branches: [ main, develop ]

jobs:
  changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ⚠️ job 이름에 "(20.x)" 를 직접 넣는다. matrix 로 만들지 않는다.
  # ruleset 의 required context 가 "Build & Test Frontend (20.x)" 인데,
  # matrix job 이 if: 로 skip 되면 matrix 가 전개되지 않아
  # "Build & Test Frontend" 로만 보고된다 → required 이름과 불일치 → PR 영구 BLOCKED.
  # node 버전을 늘릴 일이 생기면 그때 matrix 로 되돌리되 ruleset context 도 함께 고칠 것.
  build-and-test:
    name: Build & Test Frontend (20.x)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20.x'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Run Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build for Production
        run: |
          cd frontend
          npm run build
        env:
          # TODO: Configure environment variables if needed for build
          VITE_API_BASE_URL: http://localhost:8080

      - name: Check Build Output
        run: |
          ls -la frontend/dist/
          [ -f frontend/dist/index.html ] && echo "✓ index.html exists" || exit 1

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

      - name: Upload Test Coverage (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
        continue-on-error: true

  build-docker:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # TODO: Update docker registry, image name, and credentials
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: myatlas-frontend:latest
          build-args: |
            VITE_API_BASE_URL=http://backend:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: Uncomment and configure below for actual Docker registry push (requires registry credentials in GitHub Secrets)
      # - name: Login to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io  # Change if using different registry
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
