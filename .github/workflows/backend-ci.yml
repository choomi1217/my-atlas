name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # ⚠️ pull_request 에는 paths 필터를 두지 않는다.
  # "Build & Test Backend" 가 ruleset 의 required status check 라,
  # 필터로 워크플로가 트리거되지 않으면 상태 보고가 없어 PR 이 영구 대기한다.
  # 대신 아래 changes job 으로 판별해 무관한 PR 에서는 build-and-test 를 skip 한다.
  # (skip 된 job 은 상태가 보고되므로 required check 를 충족한다)
  pull_request:
    branches: [ main, develop ]

jobs:
  changes:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(backend/|\.github/workflows/backend-ci\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test Backend
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: myatlas_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x backend/gradlew

      - name: Build with Gradle
        run: |
          cd backend
          ./gradlew build --no-daemon
        env:
          # TODO: Replace with actual backend-specific env vars if needed
          POSTGRES_URL: jdbc:postgresql://localhost:5432/myatlas_test_db
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: test_password

      - name: Run Tests
        run: |
          cd backend
          ./gradlew test --no-daemon
        env:
          POSTGRES_URL: jdbc:postgresql://localhost:5432/myatlas_test_db
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: test_password

      - name: Generate Test Coverage Report
        run: |
          cd backend
          ./gradlew jacocoTestReport --no-daemon

      - name: Verify Test Coverage (70% minimum)
        run: |
          cd backend
          ./gradlew jacocoTestCoverageVerification --no-daemon
        continue-on-error: true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test/
          retention-days: 30

      - name: Publish JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-reports
          path: backend/build/reports/jacoco/
          retention-days: 30

  build-docker:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # TODO: Update docker registry, image name, and credentials
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: myatlas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: Uncomment and configure below for actual Docker registry push (requires registry credentials in GitHub Secrets)
      # - name: Login to Docker Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io  # Change if using different registry
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
