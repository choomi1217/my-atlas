version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-myqaweb}-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/myqaweb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-myqaweb}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_KEY: ${JIRA_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./backend/feature-images:/app/feature-images
      - ./backend/kb-images:/app/kb-images
      - ./backend/convention-images:/app/convention-images

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-myqaweb}-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://${COMPOSE_CONTAINER_PREFIX:-myqaweb}-backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  # registry_v20 에이전트 실행 워커 (opt-in: docker compose --profile worker up)
  agent-worker:
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-myqaweb}-agent-worker
    restart: unless-stopped
    profiles: ["worker"]
    environment:
      BACKEND_URL: http://${COMPOSE_CONTAINER_PREFIX:-myqaweb}-backend:8080
      AGENT_WORKER_USERNAME: ${AGENT_WORKER_USERNAME:-admin}
      AGENT_WORKER_PASSWORD: ${AGENT_WORKER_PASSWORD:-admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-claude-haiku-4-5-20251001}
      HEADLESS: "true"
      POLL_PRODUCT_ID: ${POLL_PRODUCT_ID}
      MAX_STEP_ACTIONS: ${MAX_STEP_ACTIONS:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
